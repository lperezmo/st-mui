[build-system]
requires = ["setuptools>=70,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st-mui"
version = "0.5.5"
description = "Material UI and MUI X components for Streamlit, built with Components v2."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Luis Perez", email = "lperezmo@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
]
keywords = ["streamlit", "mui", "material-ui", "data-grid", "components"]
dependencies = [
    "streamlit>=1.51",
]

[project.urls]
Homepage = "https://github.com/lperezmo/st-mui"
Repository = "https://github.com/lperezmo/st-mui"
Issues = "https://github.com/lperezmo/st-mui/issues"

[tool.setuptools.packages.find]
include = ["st_mui*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"st_mui" = ["pyproject.toml"]
"st_mui.date_picker" = ["frontend/build/**/*"]
"st_mui.time_picker" = ["frontend/build/**/*"]
"st_mui.date_time_picker" = ["frontend/build/**/*"]
"st_mui.date_range_picker" = ["frontend/build/**/*"]
"st_mui.date_time_range_picker" = ["frontend/build/**/*"]
"st_mui.tree_view" = ["frontend/build/**/*"]
"st_mui.autocomplete" = ["frontend/build/**/*"]
"st_mui.slider" = ["frontend/build/**/*"]
"st_mui.rating" = ["frontend/build/**/*"]
"st_mui.data_grid" = ["frontend/build/**/*"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
    "st_mui/pyproject.toml:project.version",
]
# semantic-release updates the version files before running this command.
# Refresh and stage uv.lock so the release commit and tag stay reproducible.
# Chain the commands so a lock failure aborts the release before commit/tag.
# PSR v9 only injects NEW_VERSION, so use the project name explicitly.
build_command = 'python -m pip install "uv==0.11.32" && uv lock --upgrade-package "st-mui" && git add uv.lock'
tag_format = "v{version}"
commit_message = "chore(release): v{version}"

[tool.ruff]
extend-exclude = ["references/"]
