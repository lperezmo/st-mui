name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Verify dependency lock and security floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv lock --check
      - run: python scripts/assert_lock_security.py

  # Unit tests, TypeScript type check, and Prettier check of the frontend. The
  # type check runs independently of the build (Vite transpiles without
  # type-checking), so it is the only gate that catches type regressions such
  # as passing a prop MUI does not accept. format:check uses endOfLine "auto"
  # so it agrees with CRLF working trees on Windows and LF checkouts here.
  frontend:
    name: Test, typecheck and format-check frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: st_mui/frontend
      - run: npm test
        working-directory: st_mui/frontend
      - run: npm run typecheck
        working-directory: st_mui/frontend
      - run: npm run format:check
        working-directory: st_mui/frontend

  # Build the frontend once and share the built assets with every test leg.
  # build/ is gitignored, so without this the package can't register components.
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm run build
        working-directory: st_mui/frontend
      - name: Assert production build
        run: bash scripts/assert_prod_build.sh
      - run: tar czf frontend-build.tgz st_mui/*/frontend/build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-build
          path: frontend-build.tgz
          retention-days: 1

  # Exercise the exact wheel/sdist path used by releases. Editable installs do
  # not reveal missing package-data entries, so inspect both archives and
  # require one production bundle for every declared component.
  package:
    name: Build and inspect package
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-build
      - run: tar xzf frontend-build.tgz
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python scripts/assert_package_contents.py
      - run: python -m twine check dist/*
      - name: Prove the sdist can build a wheel
        run: python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
      - name: Install and import the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps sdist-wheel/*.whl
          cd "$RUNNER_TEMP"
          python -c "import st_mui; print(st_mui.__all__)"

  # Fast, browser-less guards across every supported Streamlit minor. The
  # oldest supported combination also runs on Python 3.10 so datetime parsing
  # cannot regress unnoticed.
  smoke:
    name: Python ${{ matrix.python }} / Streamlit ${{ matrix.streamlit || 'latest' }}
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            streamlit: '1.51.*'
          - python: '3.13'
            streamlit: '1.51.*'
          - python: '3.13'
            streamlit: '1.52.*'
          - python: '3.13'
            streamlit: '1.53.*'
          - python: '3.13'
            streamlit: '1.56.*'
          - python: '3.13'
            streamlit: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-build
      - run: tar xzf frontend-build.tgz
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Install package and selected Streamlit
        run: |
          uv venv
          if [ -n "${{ matrix.streamlit }}" ]; then
            uv pip install -e . pytest "streamlit==${{ matrix.streamlit }}"
          else
            uv pip install -e . pytest
          fi
      - run: .venv/bin/python -c "import streamlit; print('streamlit', streamlit.__version__)"
      - run: .venv/bin/python -m pytest test -v
