name: Build & Publish to PyPI (Manual)

# Fallback for manually retrying a tag-based release. Select the existing v*
# tag in the workflow's "Run workflow" ref selector, not the default branch.
# Tag-scoped runs cannot write to the default branch's Actions cache namespace.
# Automated releases are handled by release.yml via python-semantic-release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm release tag is on master
        run: |
          git show-ref --verify --quiet "$RELEASE_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_REF")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/master

      # Build all frontend components
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          # Publishing must not restore caches writable by other workflows.
          package-manager-cache: false
      - run: |
          npm ci
          npm run build
        working-directory: st_mui/frontend

      - name: Assert production build
        run: bash scripts/assert_prod_build.sh

      # Build the Python dists
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Verify release lock and dependency security floor
        run: |
          uv lock --check
          python scripts/assert_lock_security.py
      - run: |
          python -m pip install --upgrade build twine
          python -m build
          python scripts/assert_package_contents.py
          python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false
