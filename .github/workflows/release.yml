name: Release & Publish

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.13' }

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@21ed7fa03e4a17ac49406eff4b60d5ad050fbdc2 # v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Build frontend
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          # Publishing must not restore caches writable by other workflows.
          package-manager-cache: false
      - run: npm ci && npm run build
        working-directory: st_mui/frontend

      - name: Assert production build
        run: bash scripts/assert_prod_build.sh

      # Build Python package
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Verify release lock and dependency security floor
        run: |
          uv lock --check
          python scripts/assert_lock_security.py
      - run: |
          python -m pip install --upgrade build twine
          python -m build
          python scripts/assert_package_contents.py
          python -m twine check dist/*

      # Upload dists to the GitHub Release that semantic-release already created
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/* --clobber

      # Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false

  # Streamlit Cloud redeploys the demo app on a push to master, so without a
  # commit here the app keeps serving whatever it installed at its last deploy.
  # This bumps the floor in examples/requirements.txt to force that redeploy.
  #
  # It needs publish, not just release: the floor must never name a version
  # PyPI cannot serve yet. A ">=" floor is no safer than an exact pin, because
  # pip cannot satisfy a floor above the newest published version.
  bump-demo:
    needs: [release, publish]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.13' }

      # A successful upload is not the same as an installable release: the
      # index and the CDN in front of the files take their own time to catch
      # up. Poll the thing the demo app actually does - resolve and fetch the
      # wheel from PyPI - rather than sleeping a fixed guess.
      - name: Wait for the release to be installable from PyPI
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          deadline=$(( SECONDS + 600 ))
          attempt=0
          until pip download "st-mui==${VERSION}" \
              --no-deps --only-binary=:all: --no-cache-dir \
              --dest "$dest" >/dev/null 2>&1; do
            attempt=$(( attempt + 1 ))
            if (( SECONDS >= deadline )); then
              echo "::error::st-mui==${VERSION} was still not installable"\
                   "from PyPI after 10 minutes. The demo app was left on the"\
                   "previous version; re-run this job once the release shows"\
                   "up on PyPI."
              exit 1
            fi
            echo "Attempt ${attempt}: ${VERSION} not on PyPI yet, retrying in 15s"
            sleep 15
          done
          # This runner reached one CDN edge; the one serving the demo app's
          # build may be a few seconds behind it.
          echo "${VERSION} is installable. Letting the CDN settle for 30s."
          sleep 30

      - name: Bump demo app version requirement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.release.outputs.version }}"
          sed -i "s/st-mui>=.*/st-mui>=${VERSION}/" examples/requirements.txt
          if git diff --quiet -- examples/requirements.txt; then
            echo "examples/requirements.txt already names ${VERSION}; nothing to push."
            exit 0
          fi
          git add examples/requirements.txt
          git commit -m "chore: bump demo app requirement to v${VERSION}"
          git push

